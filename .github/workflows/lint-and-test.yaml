name: Lint and Test

on:
  pull_request:
    branches:
      - main

jobs:
  pre-commit:
    uses: radiorabe/actions/.github/workflows/test-pre-commit.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
  test-python-poetry:
    uses: radiorabe/actions/.github/workflows/test-python-poetry.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
  github-actions:
    permissions:
      contents: read
      security-events: write # so zizmor can publish results to the Security tab
    uses: radiorabe/actions/.github/workflows/test-github-actions.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
